<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Glowing Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .banner-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .banner-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dashMove 12s linear infinite;
    }
    .pulse-glow {
      animation: pulseAnim 4s ease-in-out infinite;
    }
    .floating-card {
      animation: floatAnim 6s ease-in-out infinite alternate;
    }
    @keyframes dashMove {
      to {
        stroke-dashoffset: -160;
      }
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes floatAnim {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Cybernetic Grid Overlay -->
  <rect width="1200" height="360" fill="url(#cyberGrid)" />

  <!-- Dynamic Glowing Circuit / Hex Atmosphere in Background -->
  <g class="pulse-glow" style="transform-origin: 200px 180px;">
    <circle cx="180" cy="180" r="140" fill="#00f2fe" filter="url(#glow)" opacity="0.12" />
  </g>
  <g class="pulse-glow" style="transform-origin: 1000px 160px; animation-delay: 2s;">
    <circle cx="1020" cy="160" r="160" fill="#7f00ff" filter="url(#glow)" opacity="0.15" />
  </g>

  <!-- Background Animated Data Stream Lines (Kept Behind Text) -->
  <g opacity="0.35">
    <path class="flow-line" d="M -50,60 L 350,60 L 450,110 L 950,110 L 1050,60 L 1250,60" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-line" d="M -50,300 L 250,300 L 380,240 L 820,240 L 920,300 L 1250,300" fill="none" stroke="#818cf8" stroke-width="2" style="animation-duration: 8s;" />
  </g>

  <!-- Decorative Low-level Machine Code Particles in Background -->
  <g opacity="0.2" fill="#38bdf8" font-family="monospace" font-size="12">
    <text x="50" y="45">0x7F 0x45 0x4C 0x46 (ELF_HEADER)</text>
    <text x="960" y="45">48 89 E5 48 83 EC 20</text>
    <text x="60" y="335">x86_64 / AArch64 / ARMv8 / MIPS / RISC-V</text>
    <text x="980" y="335">CALL __libc_start_main</text>
  </g>

  <!-- FOREGROUND CONTENT: Safe Centered Presentation -->
  <g transform="translate(600, 110)">
    <!-- Header Pill Badge -->
    <rect x="-180" y="-70" width="360" height="36" rx="18" fill="url(#badgeGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" filter="url(#softGlow)"/>
    <text x="0" y="-47" text-anchor="middle" class="badge-text">⚡ REVERSE ENGINEERING &amp; BINARY ANALYSIS</text>

    <!-- Main Title -->
    <text x="0" y="25" text-anchor="middle" class="banner-title">
      Awesome Binary Disassembly
    </text>

    <!-- Title Underline Accent Bar -->
    <rect x="-160" y="42" width="320" height="4" rx="2" fill="url(#primaryGlow)" />

    <!-- Subtitle -->
    <text x="0" y="80" text-anchor="middle" class="banner-subtitle">
      Disassemblers • Multi-Arch Decompilers • Symbolic Execution • Dynamic Instrumentation &amp; Debuggers
    </text>

    <!-- Interactive / Feature Badges Ribbon -->
    <g transform="translate(0, 125)">
      <!-- Feature 1 -->
      <g transform="translate(-360, 0)">
        <rect x="0" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="17" r="4" fill="#22c55e" />
        <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Static Decompilation</text>
      </g>
      <!-- Feature 2 -->
      <g transform="translate(-180, 0)">
        <rect x="0" y="0" width="170" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="17" r="4" fill="#38bdf8" />
        <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Dynamic Debuggers</text>
      </g>
      <!-- Feature 3 -->
      <g transform="translate(10, 0)">
        <rect x="0" y="0" width="170" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="17" r="4" fill="#a855f7" />
        <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Symbolic Execution</text>
      </g>
      <!-- Feature 4 -->
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="17" r="4" fill="#f59e0b" />
        <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Malware Detonation</text>
      </g>
    </g>
  </g>
</svg>
