<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050814"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#4facfe"/><stop offset="100%" stop-color="#7f00ff"/></linearGradient><linearGradient id="badgeGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".9"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity=".3"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseAnim{0%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.08)}}@keyframes floatAnim{0%{transform:translateY(0)}}.banner-subtitle,.banner-title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.banner-title{font-weight:900;font-size:42px;fill:#fff;letter-spacing:-.5px}.banner-subtitle{font-weight:400;font-size:17px;fill:#94a3b8}.badge-text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px;font-weight:600;fill:#38bdf8}.flow-line{stroke-dasharray:8,8;animation:dashMove 12s linear infinite}.pulse-glow{animation:pulseAnim 4s ea